networks:
  srcs_devsec-net:
    name: srcs_devsec-net
    driver: bridge
  
volumes:
  postgres-data:
    driver: local

services:
  postgres:
    build:
      context: ./reqs/postgres
      dockerfile: Dockerfile
    container_name: postgres
    networks:
      - srcs_devsec-net
    environment:
      - POSTGRES_PASSWORD=devSecOps2026
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql
    restart: unless-stopped

  app:
    build:
      context: ./reqs/node
      dockerfile: Dockerfile
    container_name: app
    hostname: app
    networks:
      - srcs_devsec-net
    environment:
      - POSTGRES_PASSWORD=devSecOps2026
    ports:
      - "3000:3000"
    depends_on:
      - postgres
    restart: unless-stopped

  built-vul-nginx:
    build:
      context: ./reqs/frontend
      dockerfile: Dockerfile
    image: my-vul-nginx:nginx
    container_name: built-vul-nginx
    networks:
      - srcs_devsec-net
    ports:
      - "8080:80"
    depends_on:
      - app
    restart: unless-stopped

