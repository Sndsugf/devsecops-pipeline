<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>Mini App DevSecOps</title>
</head>
<body>
  <h1>Mini application DevSecOps</h1>
  <p>Frontend servi par Nginx, API proxifiee vers le conteneur Node.js.</p>

  <h2>Ajouter un item</h2>
  <input type="text" id="itemName" placeholder="Nom de l'item">
  <button onclick="addItem()">Ajouter</button>

  <h2>Liste des items</h2>
  <ul id="itemsList"></ul>

  <script>
    async function loadItems() {
      const res = await fetch('/api/items');
      const items = await res.json();
      const list = document.getElementById('itemsList');
      list.innerHTML = '';
      items.forEach(item => {
        const li = document.createElement('li');
        li.textContent = `#${item.id} - ${item.name}`;
        list.appendChild(li);
      });
    }

    async function addItem() {
      const name = document.getElementById('itemName').value;
      if (!name) return;
      await fetch('/api/items', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ name })
      });
      document.getElementById('itemName').value = '';
      loadItems();
    }

    loadItems();
  </script>
</body>
</html>
